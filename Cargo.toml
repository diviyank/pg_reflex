[workspace]
members = ["fuzz_model"]
# "fuzz_sweep" re-added in Phase F

[package]
name = "pg_reflex"
version = "1.9.1"
edition = "2021"
description = "Incremental materialized view maintenance for PostgreSQL"
license = "Apache-2.0"
repository = "https://github.com/diviyank/pg_reflex"
authors = ["Diviyan Kalainathan"]

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg17"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15" ]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16" ]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17" ]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18" ]
pg_test = ["dep:proptest", "dep:fuzz_model"]

[dependencies]
pgrx = "=0.18.0"
sqlparser = { version = "0.60", features = ["visitor"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = { version = "1", optional = true }
fuzz_model = { path = "fuzz_model", optional = true }

[dev-dependencies]
pgrx-tests = "=0.18.0"
proptest = "1"
insta = { version = "1", features = ["yaml"] }
fuzz_model = { path = "fuzz_model" }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
